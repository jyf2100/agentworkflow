# pyproject.toml — 项目推进流水线·声明式 Python 环境（OpenSpec reproducible-pipeline-validation）。
#
# 把原先「靠人手 pip3 install」的隐含依赖收敛进版本化元数据：干净环境一条
#   pip install -e ".[dev]"
# 即装齐编排器（run_daily.py）、inject 段（pypinyin）、控制面标准执行器（dev-agent.py / claude-agent-sdk）
# 与质量工具（pytest / ruff）。详见 docs/adr/0006 与本变更 proposal。
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-pipeline"
version = "0.1.0"
description = "项目推进流水线 — 全自动研发流水线编排器与控制面标准执行器"
readme = "CONTEXT.md"
requires-python = ">=3.11"
dependencies = [
    # run_daily.py 顶层 import（缺则编排器直接 sys.exit，cron 崩）
    "PyYAML>=6.0",
    # stage_inject 的 _pinyin_slug（惰性 import；缺则 inject 段 sys.exit）
    "pypinyin>=0.50",
    # dev-agent.py 控制面标准执行器（ADR-0006）：在目标仓 worktree 内驱动 SDK dev loop
    # 上界 <0.2.123：0.2.123 起 can_use_tool 回调要求 streaming 模式（AsyncIterable prompt），
    # 本执行器用 string-prompt query() → 触 "can_use_tool callback requires streaming mode"。
    # 0.2.121 实证可用（ashare env 跑完 84-turn dev loop）。streaming 迁移为 follow-up。
    "claude-agent-sdk>=0.2.121,<0.2.123",
]

[project.optional-dependencies]
# 质量开发环境：pytest + ruff。CI 与本地 `pip install -e ".[dev]"` 共用此声明。
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# 本仓脚本以「路径同目录 import」方式互引（sys.path.insert，见各 test_*），并非可安装包；
# 显式置空避免 setuptools 自动发现报错，pip install -e 只落元数据 + 依赖。
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["scripts"]   # 让 scripts/ 下扁平模块（run_daily/slug_utils/bash_allowlist）可被 test_* 直接 import
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 实缺陷规则集（基线已绿）：E9 = 语法/缩进致命错；F = Pyflakes（未定义名 / 未用导入 / 未用变量 / 空 f-string）。
# 不开 E7/E4 等纯风格规则——本仓 test_* 的紧凑 `a; b` 写法是有意为之，开它们会成 76 条噪声。
select = ["E9", "F"]
